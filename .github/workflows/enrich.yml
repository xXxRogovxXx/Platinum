name: Enrich game data

# Робот сам подтягивает обложки и достижения из Steam для игр из Google Doc.
on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch: {}        # и кнопкой «Run workflow» вручную

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve covers & achievements
        run: node scripts/enrich.js
      - name: Commit updated data
        run: |
          if git diff --quiet -- covers.json achievements.json data/cache.json; then
            echo "Нет изменений — коммитить нечего."
            exit 0
          fi
          git config user.name "platinum-vault-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers.json achievements.json data/cache.json
          git commit -m "Auto-enrich: обложки и достижения из Steam"
          # Пуш с повтором: если кто-то успел закоммитить — подтягиваем и пробуем снова.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Запушено с попытки $i."
              exit 0
            fi
            echo "Push отклонён — подтягиваю удалённые изменения (попытка $i)…"
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          echo "Не удалось запушить после 5 попыток." >&2
          exit 1
