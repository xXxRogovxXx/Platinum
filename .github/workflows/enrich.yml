name: Enrich game data

# Робот сам подтягивает обложки и достижения из Steam для игр из Google Doc.
on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch: {}        # и кнопкой «Run workflow» вручную

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve covers & achievements
        run: node scripts/enrich.js
      - name: Commit updated data
        run: |
          git config user.name "platinum-vault-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers.json achievements.json data/cache.json
          if git diff --staged --quiet; then
            echo "Ничего не изменилось."
          else
            git commit -m "Auto-enrich: обложки и достижения из Steam"
            git push
          fi
